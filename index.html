<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./img/ThisPC_img.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro macOS Portfolio</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <!-- CRT Monitor Frame -->
  <div id="monitor" class="monitor-overlay">
    <div id="screen" class="screen">
      <!-- Boot Terminal -->
      <div id="boot-terminal" class="terminal">
        <div id="terminal-content" class="terminal-content"></div>
        <div id="loading-container" class="loading-container hidden">
          <div id="loading-bar-wrapper">
            <div id="loading-bar"></div>
          </div>
          <div id="loading-percentage">0%</div>
        </div>
      </div>

      <!-- Desktop Environment (Initially Hidden) -->
      <div id="desktop" class="desktop hidden">
        <div class="top-bar">
          <div class="top-bar-left">
            <span class="apple-icon"></span>
            <span class="menu-item active">Finder</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
          </div>
          <div class="top-bar-right">
            <span id="current-time">00:00</span>
          </div>
        </div>

        <!-- Bottom Dock -->
        <div class="dock">
          <div class="dock-item" id="this-pc" data-label="This PC" draggable="true">
            <img src="./img/ThisPC_img.png" alt="This PC" />
            <span class="tooltip">This PC</span>
          </div>
          <div class="dock-item" id="files" data-label="Files" draggable="true">
            <img src="./img/files33.png" alt="Files" />
            <span class="tooltip">Files</span>
          </div>
          <div class="dock-item" id="resume" data-label="Resume" draggable="true">
            <img src="./img/Resume.png" alt="Resume" />
            <span class="tooltip">Resume</span>
          </div>
          <div class="dock-item" id="terminal" data-label="Terminal" draggable="true">
            <img src="./img/nuke.png" alt="Terminal" />
            <span class="tooltip">Terminal</span>
          </div>
          <div class="dock-item" id="research" data-label="Research" draggable="true">
            <img src="./img/microscope.png" alt="Research" />
            <span class="tooltip">Research</span>
          </div>
          <div class="dock-item" id="dock-github" data-label="GitHub" draggable="true">
            <img src="./img/gittt.png" alt="GitHub" />
            <span class="tooltip">GitHub</span>
          </div>
          <div class="dock-item" id="paint" data-label="Paint" draggable="true">
            <img src="./img/paint_icon.png" alt="Paint" />
            <span class="tooltip">Paint</span>
          </div>
          <div class="dock-item" id="flappy-bird" data-label="Flappy Bird" draggable="true">
            <img src="./img/flappy-bird_img.png" alt="Flappy Bird" />
            <span class="tooltip">Flappy Bird</span>
          </div>
          <div class="dock-item" id="contact" data-label="Contact" draggable="true">
            <img src="./img/ThisPC_img.png" alt="Contact" />
            <span class="tooltip">Contact</span>
          </div>
          <div class="dock-item" id="calendar" data-label="Calendar" draggable="true">
            <img src="./img/calender1.png" alt="Calendar" />
            <span class="tooltip">Calendar</span>
          </div>
          <div class="dock-item" id="trash" data-label="Trash" draggable="true">
            <img src="./img/Trash.png" alt="Trash" />
            <span class="tooltip">Trash</span>
          </div>
          <div class="dock-item" id="menu" data-label="Menu" draggable="true">
            <img src="./img/nuke.png" alt="Menu" />
            <span class="tooltip">Menu</span>
          </div>
        </div>

        <!-- Window Manager Container -->
        <div id="window-container"></div>

        <!-- Context Menu -->
        <div id="context-menu" class="context-menu hidden">
          <div class="context-menu-item" data-action="change-wallpaper">Change Wallpaper</div>
          <div class="context-menu-item" data-action="refresh">Refresh</div>
          <div class="context-menu-separator"></div>
          <div class="context-menu-item" data-action="terminal">Open Terminal</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
